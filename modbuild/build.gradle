plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "easycraftchest-neoforge-1.21.1"
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // 把命令行 -Decc.trace/-Decc.info 转发给游戏 JVM(仅开发 runClient 生效,正式包不受影响)。
            // 用法:./gradlew runClient -Decc.trace=true
            systemProperty 'ecc.trace', System.getProperty('ecc.trace', 'false')
            systemProperty 'ecc.info', System.getProperty('ecc.info', 'false')
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Set up a 'localRuntime' configuration, like the MDK does, in case optional mod deps are needed at runtime.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // No extra dependencies: this mod is self-contained.
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

runClient {
    // 禁用 GameTest
    systemProperty 'neoforge.enableGameTest', 'false'
}